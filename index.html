  async function prepare(opts) {

  function mulberry(seed) {

    }
    function begin(reason, st) {
      if (!started) { started = true; clearTimeout(helloTimer); }

    }
    function applyRemote(m) {                                  // oaspete: o mutare numerotată de la gazdă
      if (m.seq <= seq) { stats.dupes++; return; }
      if (m.seq > seq + 1) { ahead.set(m.seq, m); send({t: 'need', from: seq}); return; }
      const mine = m.from === 'guest' && pending.has(m.cid);
      const r = tryApply(m.move, {seq: m.seq, from: m.from, mine, rng});
      if (!r.ok) { fail('diverged', {detail: r.reason}); stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      seq = m.seq; stats.applied++;
      if (mine) { const p = pending.get(m.cid); pending.delete(m.cid); clearTimeout(p.timer); p.resolve({seq, ok: true}); }
      if (o.hash && m.h != null && String(o.hash()) !== String(m.h)) { stats.resyncs++; send({t: 'need', from: seq, force: true}); return; }
      const nx = ahead.get(seq + 1); if (nx) { ahead.delete(seq + 1); applyRemote(nx); }
    }
    function hostApply(move, from, cidv) {                     // gazdă: validează, aplică, numerotează, difuzează
      if (move == null || typeof move !== 'object') return {ok: false, reason: 'bad-move'};
      if (o.validate) { const v = o.validate(move, {from, seq: seq + 1}); if (v !== true && v !== undefined) return {ok: false, reason: typeof v === 'string' ? v : 'invalid'}; }
      const r = tryApply(move, {seq: seq + 1, from, mine: from === 'host', rng});

    }

    function hello() {

      /** Trimite o mutare. Gazdă: aplică imediat; oaspete: așteaptă ecoul numerotat al gazdei. Returnează Promise<{seq}>. */

      /** Cere resincronizarea completă (oaspete) sau retrimite starea (gazdă). */

<style>

.layouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lay{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.9rem}
.thumb{width:100%;height:110px;display:block;margin-bottom:6px}
dl.gloss dt{font-weight:700;color:var(--gold);margin-top:.6em}dl.gloss dd{margin:0 0 0 1em}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
legend{padding:0 8px;color:var(--gold)}
.picks{display:grid;gap:8px}
.pick{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;cursor:pointer}
.pick:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.pk-body{display:flex;flex-direction:column}
.orow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.orow>label{flex:1 1 240px}.orow.chk{min-height:44px}.orow.chk label{flex:1 1 auto;padding:10px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.toolbar.sub{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.stats{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;color:var(--gold);margin:6px 0}
.msg{min-height:1.6em;margin:4px 0;color:var(--fg)}
.board-wrap{overflow:auto;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.board{display:inline-block;max-width:100%;touch-action:manipulation}
.board:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.st{cursor:pointer}
.st .dim{fill:#000;opacity:0;pointer-events:none}
.st.blocked .dim{opacity:.38}
.st.sel .dim{fill:#ffd24d;opacity:.55}
.st.hint .dim{fill:#3ddc84;opacity:.5;animation:pulse 1s ease-in-out infinite alternate}
.cursor{fill:none;stroke:var(--focus);stroke-width:3;stroke-dasharray:6 3;pointer-events:none}
@keyframes pulse{from{opacity:.25}to{opacity:.6}}
.table{background:linear-gradient(180deg,var(--felt),var(--felt2));border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--fg)}
:root[data-theme=light] .table{color:#10241a}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;margin-bottom:8px}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.seat{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px}
:root[data-theme=light] .seat{background:rgba(255,255,255,.45);border-color:rgba(0,0,0,.15)}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.seat-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.seat-head .score{margin-left:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.seat-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.melds,.hand-back,.hand-open,.flw{display:flex;gap:2px;flex-wrap:wrap}
.meld{display:inline-flex;gap:1px;margin-right:6px}
.river{display:flex;flex-wrap:wrap;gap:1px;min-height:38px;border-top:1px dashed rgba(255,255,255,.25);padding-top:6px;margin-top:4px}
.rt.called{opacity:.35}.rt.last{outline:2px solid var(--gold);border-radius:4px}
#tbl-me .seat{margin-top:8px}
.hand{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;margin-top:8px}
.ht{background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:6px;min-width:44px;min-height:58px;transition:transform .12s}
.ht:hover:not(.nolegal){transform:translateY(-6px)}
.ht.nolegal{cursor:default;opacity:.55}
.ht.hinted{outline:3px solid var(--ok);outline-offset:1px}
.ht.drawn{margin-left:4px}
.gap{display:inline-block;width:10px}
.prompt{font-weight:700;margin:10px 0 6px;min-height:1.5em}
.table .actions{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.result{background:var(--bg2);color:var(--fg);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;margin-top:10px}
.result:empty{display:none}
.winhand{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin:6px 0}
.wt{outline:2px solid var(--gold);border-radius:4px}
.yaku{padding-left:1.2em;margin:6px 0}
.sum{font-weight:700;color:var(--gold)}
.rank{padding-left:1.4em}
.feed{margin-top:10px;font-size:.88rem;color:var(--mut)}
.feed ol{margin:0;padding-left:1.2em;max-height:9em;overflow:auto}
@media (max-width:560px){.wrap{padding:0 12px}.ht{min-width:44px}.tl.hd{width:44px;height:58px}.seats{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-motion=reduce] *{animation:none!important;transition:none!important}
noscript .ns{margin:20px;padding:14px;border:2px solid #c8832a;border-radius:10px;background:#1a1410;color:#f1e6d0}
</style>

  'sol.help': ['Alege două piese libere identice (florile se potrivesc între ele, anotimpurile între ele). O piesă e liberă dacă nu are nimic deasupra și are partea stângă sau dreaptă liberă. Tastatură: săgeți = mută cursorul, Enter/Spațiu = alege.', 'Pick two identical free tiles (flowers match each other, seasons match each other). A tile is free when nothing lies on top and its left or right side is open. Keyboard: arrows move the cursor, Enter/Space selects.', 'Choisissez deux tuiles libres identiques (les fleurs s’associent entre elles, les saisons entre elles). Une tuile est libre si rien n’est dessus et si son côté gauche ou droit est dégagé. Clavier : flèches = curseur, Entrée/Espace = choisir.', 'Scegli due tessere libere identiche (i fiori si abbinano tra loro, le stagioni tra loro). Una tessera è libera se non ha nulla sopra e ha il lato sinistro o destro libero. Tastiera: frecce = cursore, Invio/Spazio = scegli.', 'Elige dos fichas libres idénticas (las flores casan entre sí, las estaciones entre sí). Una ficha es libre si no tiene nada encima y su lado izquierdo o derecho está libre. Teclado: flechas = cursor, Intro/Espacio = elegir.', 'Escolha duas peças livres idênticas (flores combinam entre si, estações entre si). Uma peça é livre se não tem nada por cima e tem o lado esquerdo ou direito livre. Teclado: setas = cursor, Enter/Espaço = escolher.', 'Wähle zwei gleiche freie Steine (Blumen passen zu Blumen, Jahreszeiten zu Jahreszeiten). Ein Stein ist frei, wenn nichts darauf liegt und seine linke oder rechte Seite offen ist. Tastatur: Pfeile = Cursor, Eingabe/Leertaste = wählen.'],

  bar.appendChild(el('button', { type: 'button', class: 'btn', 'aria-label': t('sol.zoomIn'), title: t('sol.zoomIn'), text: '+', onclick: function () { SOL.zoom = Math.min(2, +(SOL.zoom + 0.15).toFixed(2)); applyZoom(); } }));

  lay.addEventListener('change', function () { OPTS.layout = lay.value; saveOpts(); startSol(lay.value, null); });
  opt.appendChild(el('label', { for: 'sol-layout', text: t('sol.layout') + ':' }));
  opt.appendChild(lay);

  P.appendChild(el('p', { class: 'stats', id: 'sol-stats' }));

  var order = S.pos.map(function (p, i) { return i; }).sort(function (a, b) { var pa = S.pos[a], pb = S.pos[b]; return pa.z - pb.z || pa.y - pb.y || pa.x - pb.x; });

  svg.addEventListener('click', function (ev) {

function applyZoom() {
  var svg = $('#sol-svg'), wrap = $('#sol-wrap');
  if (!svg || !wrap) return;
  var availW = Math.max(280, wrap.clientWidth - 14), availH = Math.max(360, (window.innerHeight || 800) - 400);
  var base = Math.min(availW, availH * SOL.W / SOL.H, SOL.W * 1.1);
  var w = Math.round(base * SOL.zoom);
  svg.style.width = w + 'px';
  svg.style.maxWidth = SOL.zoom <= 1 ? '100%' : 'none';
  svg.style.height = 'auto';
}
window.addEventListener('resize', function () { if (SOL && PLAY.view === 'sol') applyZoom(); });
function updateBoard() {
  if (!SOL || !SOL.nodes.length) return;
  var S = SOL.S, free = MJ.solFreeFn(S);
  var hintSet = SOL.hint ? SOL.hint : [];
  for (var i = 0; i < S.n; i++) {
    var g = SOL.nodes[i];
    if (S.removed[i]) { g.setAttribute('display', 'none'); continue; }
    g.removeAttribute('display');
    var cls = 'st';
    var f = free(i);
    if (f) cls += ' free'; else if (SOL.showFree) cls += ' blocked';
    if (SOL.sel === i) cls += ' sel';
    if (hintSet.indexOf(i) >= 0) cls += ' hint';
    g.setAttribute('class', cls);
  }
  // cursor
  var svg = $('#sol-svg');
  if (SOL.cur >= 0 && (S.removed[SOL.cur] || !free(SOL.cur))) {
    var f2 = MJ.solFreeSet(S);
    SOL.cur = f2.length ? nearestTo(SOL.cur, f2) : -1;
  }
  if (SOL.cur >= 0 && svg && (document.activeElement === svg)) {
    var p = S.pos[SOL.cur];
    SOL.hl.setAttribute('x', p.x * SW + SOL.pad - p.z * 4);
    SOL.hl.setAttribute('y', p.y * SH + SOL.pad - p.z * 5);
    SOL.hl.setAttribute('display', 'inline');
  } else SOL.hl.setAttribute('display', 'none');
  var left = MJ.solRemaining(S);
  var st = $('#sol-stats');
  if (st) st.textContent = t('sol.left') + ': ' + left + ' · ' + t('sol.moves') + ': ' + (S.moves || 0) + ' · ' + t('sol.shuffles') + ': ' + S.shuffles + ' · ' + t('sol.deal') + ': ' + SOL.seed;
  var u = $('#sol-undo');
  if (u) u.disabled = S.hist.length === 0;
  if (SOL.duel) { duelProgress(); duelRender(); }
}
function nearestTo(i, list) {
  var c = solPx(i), best = list[0], bd = 1e18;
  list.forEach(function (j) { var q = solPx(j), d = (q.x - c.x) * (q.x - c.x) + (q.y - c.y) * (q.y - c.y); if (d < bd) { bd = d; best = j; } });
  return best;
}
function solMsg(txt, announce) {
  SOL.msg = txt;
  var m = $('#sol-msg');
  if (m) m.textContent = txt;
  if (announce !== false) say(txt);
}
function solAfterMove() {
  var S = SOL.S;
  SOL.hint = null;
  if (MJ.solWon(S)) {
    if (!SOL.done) {
      SOL.done = true;
      var st = getSolStats();
      st[SOL.layout] = st[SOL.layout] || { played: 0, won: 0 };
      st[SOL.layout].won++;
      ssetJ('solstats', st);
      if (SOL.duel) duelFinish();
    }
    solMsg(t('sol.won'));
  } else if (MJ.solStuck(S)) solMsg(t('sol.stuck'));
  solSave();
  updateBoard();
}
function solPick(i) {
  var S = SOL.S;
  if (S.removed[i]) return;
  var free = MJ.solFreeFn(S);
  if (!free(i)) { solMsg(t('sol.blocked')); return; }
  if (SOL.sel < 0) { SOL.sel = i; SOL.hint = null; solMsg(t('sol.selected') + ': ' + tileName(S.face[i]), true); updateBoard(); return; }
  if (SOL.sel === i) { SOL.sel = -1; solMsg('—', false); updateBoard(); return; }
  var a = SOL.sel;
  if (MJ.solPlay(S, a, i)) {
    SOL.sel = -1;
    solMsg(t('sol.removed') + ': ' + tileName(S.face[i]), true);
    solAfterMove();
  } else {
    SOL.sel = i;
    solMsg(t('sol.noMatch'));
    updateBoard();
  }
}
function solDoHint() {
  if (SOL.duel) { solMsg(t('duel.nohint')); return; }
  var S = SOL.S;
  if (MJ.solWon(S)) return;
  var h = MJ.solHint(S, 6000);
  if (!h) { solMsg(MJ.solStuck(S) ? t('sol.stuck') : t('sol.won')); return; }
  SOL.hint = h.pair; SOL.sel = -1;
  SOL.cur = h.pair[0];
  solMsg((h.verified ? t('sol.hint.ok') : t('sol.hint.weak')) + ' ' + tileName(S.face[h.pair[0]]), true);
  updateBoard();
}
function solDoUndo() {
  if (MJ.solUndo(SOL.S)) { SOL.sel = -1; SOL.hint = null; solMsg(t('sol.undo').replace(/^\S+\s*/, ''), true); solSave(); updateBoard(); }
}
function solDoShuffle() {
  var S = SOL.S;
  if (MJ.solWon(S)) return;
  var rng = MJ.makeSeeded(((SOL.seed ^ (S.shuffles + 1) * 2654435761) ^ S.hist.length * 40503) >>> 0);
  if (MJ.solShuffle(S, rng)) { SOL.sel = -1; SOL.hint = null; solMsg(t('sol.shuffled')); solSave(); updateBoard(); }
  else { solMsg(t('sol.stuckHard')); }
}
function solKey(ev) {
  var S = SOL.S, k = ev.key;
  if (!ev.altKey && !ev.metaKey && (k === 'z' || k === 'Z') && ev.ctrlKey) { ev.preventDefault(); solDoUndo(); return; }
  if (!ev.altKey && !ev.metaKey && !ev.ctrlKey) {
    var lk = k.length === 1 ? k.toLowerCase() : '';
    if (lk === 'h') { ev.preventDefault(); solDoHint(); return; }
    if (lk === 'u') { ev.preventDefault(); solDoUndo(); return; }
    if (lk === 's') { ev.preventDefault(); solDoShuffle(); return; }
  }
  if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
    ev.preventDefault();
    if (SOL.cur >= 0) solPick(SOL.cur);
    return;
  }
  var dir = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (!dir) return;
  ev.preventDefault();
  var free = MJ.solFreeSet(S);
  if (!free.length) return;
  if (SOL.cur < 0 || S.removed[SOL.cur]) { SOL.cur = free[0]; updateBoard(); return; }
  var c = solPx(SOL.cur), best = -1, bs = 1e18;
  free.forEach(function (j) {
    if (j === SOL.cur) return;
    var q = solPx(j), dx = q.x - c.x, dy = q.y - c.y;
    var along = dx * dir[0] + dy * dir[1], perp = Math.abs(dx * dir[1] - dy * dir[0]);
    if (along <= 4) return;
    var sc = along + 2 * perp;
    if (sc < bs) { bs = sc; best = j; }
  });
  if (best >= 0) {
    SOL.cur = best;
    updateBoard();
    say(tileName(S.face[best]) + (SOL.sel === best ? ' (' + t('sol.selected') + ')' : ''));
  }
}

/* ===== UI: masa cu 4 jucători (tu + 3 AI) ===== */
var TBL = null;
var HK_BY_ID = {}, SC_BY_ID = {};
MJ.HK_TABLE.forEach(function (y) { HK_BY_ID[y.id] = y; });
MJ.SC_TABLE.forEach(function (y) { SC_BY_ID[y.id] = y; });

function pname(p) { return p === 0 ? t('tbl.you') : t('tbl.ai') + ' ' + p; }
function ruleTitle(r) { for (var i = 0; i < ATLAS.length; i++) if (ATLAS[i].id === r) return LT(ATLAS[i].name); return r; }

var SPEED_MS = { instant: 0, fast: 160, normal: 520, slow: 1000 };

function startTable(rule) {
  tblStop();
  var seed = parseSeed(OPTS.seed);
  var opts = {};
  if (rule === 'riichi') { opts.aka = OPTS.aka; opts.kuitan = OPTS.kuitan; }
  else if (rule === 'hk') { opts.minFaan = OPTS.minFaan; opts.limit = OPTS.limit; opts.flowerSet = OPTS.flowers; opts.sevenPairs = OPTS.sevenPairs; opts.payMode = OPTS.payMode; }
  else opts.blood = OPTS.blood;
  var len = OPTS.len === '8' && rule !== 'sichuan' ? 8 : 4;
  opts.rotations = len;
  var T = MJ.newTable({ rule: rule, seed: seed, humans: [true, false, false, false], opts: opts });
  TBL = {
    T: T, rule: rule, oneHand: OPTS.len === '1', speed: OPTS.speed, showHands: OPTS.showHands, timer: null, logIdx: 0,
    riichiMode: false, hint: null, ended: false, ranked: false, feedEl: null,
    aiRng: seed != null ? MJ.makeSeeded((seed ^ 0x9e3779b9) >>> 0) : MJ.makeSecure(), lastPhaseKey: '', handsPlayed: 0
  };
  PLAY.view = 'tbl';
  renderTable(true);
  tblStep();
}
function evText(e) {
  var T = TBL.T;
  switch (e.e) {
    case 'discard': return t('ev.discard', { name: pname(e.p), tile: idName(e.id) });
    case 'pon': return t('ev.pon', { name: pname(e.p) });
    case 'chi': return t('ev.chi', { name: pname(e.p) });
    case 'kan': case 'ankan': case 'kakan': return t('ev.kan', { name: pname(e.p) });
    case 'riichi': return t('ev.riichi', { name: pname(e.p) });
    case 'win': return t('ev.win', { name: pname(e.p) });
    case 'void': return t('ev.void', { name: pname(e.p), suit: t('tbl.suit.' + e.suit) });
  }
  return null;
}
function pullEvents() {
  var H = TBL.T.h, out = [];
  while (TBL.logIdx < H.log.length) {
    var s = evText(H.log[TBL.logIdx++]);
    if (s) out.push(s);
  }
  out.forEach(function (s) { feedAdd(s); });
}
function feedAdd(s) {
  if (!TBL.feedEl) return;
  TBL.feedEl.appendChild(el('li', { text: s }));
  while (TBL.feedEl.children.length > 8) TBL.feedEl.removeChild(TBL.feedEl.firstChild);
}
function delayMs() { return SPEED_MS[TBL.speed] != null ? SPEED_MS[TBL.speed] : 520; }
function aiStyle() { return { rng: TBL.aiRng, kanProb: 0.25 }; }
function aiMove(p) {
  var T = TBL.T, V = MJ.viewFor(T, p);
  try {
    MJ.act(T, p, MJ.aiDecide(V, aiStyle()));
  } catch (e) { // AUDIT: plasă de siguranță – dacă AI-ul ar eșua, joacă prima acțiune legală (evită blocarea mesei)
    var L = MJ.legalFor(T, p);
    var pass = L.filter(function (x) { return x.a === 'pass'; })[0];
    MJ.act(T, p, pass || L[0]);
  }
  pullEvents();
}
function tblStep() {
  if (!TBL) return;
  clearTimeout(TBL.timer);
  var T = TBL.T, H = T.h, guard = 0;
  var ms = delayMs();
  if (ms === 0) { // joc instant: rulează AI până când e rândul tău
    while (!H.result && guard++ < 2000) {
      var nd = MJ.needSeats(T), ai = nd.filter(function (p) { return !T.humans[p]; });
      if (!ai.length) break;
      aiMove(ai[0]);
    }
    return tblAfter();
  }
  if (!H.result) {
    var need = MJ.needSeats(T), aiNeed = need.filter(function (p) { return !T.humans[p]; });
    if (aiNeed.length) {
      var who = aiNeed[0];
      renderTable(false);
      TBL.timer = setTimeout(function () { if (!TBL) return; aiMove(who); tblStep(); }, ms);
      return;
    }
  }
  tblAfter();
}
function tblAfter() {
  if (!TBL) return;
  renderTable(false);
  var T = TBL.T, H = T.h;
  if (H.result) { showResult(); return; }
  // riichi blocat: aruncare automată a piesei trase dacă nu există alte opțiuni
  var L = MJ.legalFor(T, 0);
  if (T.rule === 'riichi' && H.riichi[0] && L.length === 1 && L[0].a === 'discard') {
    TBL.timer = setTimeout(function () { if (!TBL) return; humanAct(L[0]); }, Math.max(250, delayMs() / 2));
    return;
  }
  // mută focusul la prima acțiune când apare o întrebare (revendicare / culoare lipsă)
  var key = H.phase + ':' + H.handNo + ':' + (H.claim ? H.claim.id : '') + ':' + H.discardsTotal + ':' + H.turn;

  }
}
function humanAct(a) {
  if (!TBL) return;
  var T = TBL.T;
  if (!MJ.isLegal(T, 0, a)) { say(t('sol.blocked')); return; }
  MJ.act(T, 0, a);
  TBL.riichiMode = false; TBL.hint = null;
  pullEvents();
  tblStep();
}
